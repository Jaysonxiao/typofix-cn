[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "typofix-cn"
version = "0.1.0"
description = "Local Chinese DOCX proofreading"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "platformdirs>=4.3,<5",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
model = [
  "huggingface-hub>=0.34,<2",
  "pycorrector>=1.1.2,<2",
  "torch>=2.6,<3",
  "transformers>=4.45,<6",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
]

[project.scripts]
typofix = "typofix_cli.main:app"

[tool.setuptools.packages.find]
where = ["backend/src", "cli/src"]

[tool.pytest.ini_options]
pythonpath = ["backend/src", "cli/src"]
testpaths = ["backend/tests", "cli/tests"]
markers = ["model: requires downloaded MacBERT weights"]
